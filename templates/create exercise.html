{% extends 'plan base.html' %}
{% block title %}Add Exercise{% endblock %}
{% block content %}
{# 独立新增页面复用公共导航；验证失败保留已填写的内容。 #}
<h1>Add Your Own Exercise</h1>
<p>Your exercises are available in your workout plans and records.</p>
{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group"><label for="exercise_name">Exercise name</label>
                <input id="exercise_name" name="exercise_name" maxlength="120" required value="{{ request.form.get('exercise_name', '') }}"></div>
                <div class="form-group"><label for="equipment">Equipment (optional)</label>
                <input id="equipment" name="equipment" maxlength="120" value="{{ request.form.get('equipment', '') }}"></div>
                <div class="form-group"><label for="description">Description (optional)</label>
                <textarea id="description" name="description" maxlength="2000" rows="3">{{ request.form.get('description', '') }}</textarea></div>
                <button type="submit" class="primary-button">Add Exercise</button>
            </form>
<a class="secondary-button" href="{{ url_for('exercises') }}">Cancel</a>
{% endblock %}
