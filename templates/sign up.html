<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-information">
            <h1>GymTracker</h1>
            <h2>Track your training.<br>Build your progress.</h2>
            <p>Join GymTracker to build personalized workout plans and monitor your progress over time.</p>
        </section>

        <section class="login-card">
            <div class="login-heading">
                <h2>Create Account</h2>
                <p>Sign up to start tracking your fitness journey.</p>
            </div>

            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <!-- 验证提交来自当前会话，防止跨站请求伪造。 -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="user_name">Name</label>
                    <input type="text" id="user_name" name="user_name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="login-submit">Sign Up</button>
            </form>

            <div class="register-section">
                <p>Already have an account?</p>
                <a href="{{ url_for('login') }}" class="register-btn">Login</a>
            </div>
        </section>
    </main>
</body>
</html>
