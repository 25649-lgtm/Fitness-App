<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | GymTracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body class="plan-page">

    <main class="plan-container">

        <section class="plan-information">

            <h1>GymTracker</h1>

            <h2>Your fitness profile.</h2>

            <p>
                Keep these details current so your dashboard reflects
                your latest goal and measurements.
            </p>

            <a
                class="secondary-button"
                href="{{ url_for('homepage') }}"
            >
                Back to Dashboard
            </a>

        </section>

        <section class="plan-card">

            <div class="plan-heading">
                <h2>Profile</h2>
                <p>{{ user["email"] }}</p>
            </div>

            <!-- 错误提示置于表单前，提交失败保留刚输入的资料。 -->
            {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
            <form method="POST">
                <!-- 验证提交来自当前会话，防止跨站请求伪造。 -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="user_name">Name</label>

                    <input
                        type="text"
                        id="user_name"
                        name="user_name"
                        maxlength="120"
                        value="{{ request.form.get('user_name', user['user_name']) }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>

                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        step="any"
                        min="0.1"
                        value="{{ request.form.get('weight', user['weight'] if user['weight'] is not none else '') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>

                    <input
                        type="number"
                        id="height"
                        name="height"
                        step="any"
                        min="0.1"
                        value="{{ request.form.get('height', user['height'] if user['height'] is not none else '') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="goal">Goal</label>

                    <textarea
                        id="goal"
                        name="goal"
                        maxlength="2000"
                        rows="3"
                    >{{ request.form.get("goal", user["goal"] or "") }}</textarea>
                </div>

                <button
                    type="submit"
                    class="plan-submit"
                >
                    Save Profile
                </button>

            </form>

        </section>

    </main>

</body>
</html>
