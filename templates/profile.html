<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | GymTracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body class="plan-page">

    <main class="plan-container">

        <section class="plan-information">

            <h1>GymTracker</h1>

            <h2>Your fitness profile.</h2>

            <p>
                Keep these details current so your dashboard reflects
                your latest goal and measurements.
            </p>

            <a
                class="secondary-button"
                href="{{ url_for('homepage') }}"
            >
                Back to Dashboard
            </a>

        </section>

        <section class="plan-card">

            <div class="plan-heading">
                <h2>Profile</h2>
                <p>{{ user["email"] }}</p>
            </div>

            <form method="POST">

                <div class="form-group">
                    <label for="user_name">Name</label>

                    <input
                        type="text"
                        id="user_name"
                        name="user_name"
                        value="{{ user['user_name'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>

                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        step="0.1"
                        min="0"
                        value="{{ user['weight'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>

                    <input
                        type="number"
                        id="height"
                        name="height"
                        step="0.1"
                        min="0"
                        value="{{ user['height'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label for="goal">Goal</label>

                    <textarea
                        id="goal"
                        name="goal"
                        rows="3"
                    >{{ user["goal"] or "" }}</textarea>
                </div>

                <button
                    type="submit"
                    class="plan-submit"
                >
                    Save Profile
                </button>

            </form>

        </section>

    </main>

</body>
</html>
